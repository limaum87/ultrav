openapi: 3.1.0
info:
  title: UltraV API
  version: 1.0.0
  summary: API-first KVM/QEMU virtual machine management
  description: |
    UltraV is a modern, simple, API-first management layer for KVM/QEMU
    virtual machines on single Linux hosts.

    **Everything is an API.** Every UI capability is available here first.
    This contract is the source of truth for the Web UI, CLI, scripts,
    automation, and future AI agents (MCP adapters).

    ## Conventions
    - All requests/responses are JSON.
    - Every response includes an `X-Request-Id` header; errors also include `requestId` in the body.
    - Errors use a stable envelope: `{"error": {"code", "message", "requestId"}}`.
    - Destructive or long-running operations will use specific, semantically
      named operations (never generic `execute`/`command` endpoints).
  license:
    name: TBD
servers:
  - url: /api/v1
    description: Local host (single-node)

tags:
  - name: Auth
    description: Authentication (JWT bearer)
  - name: Users
    description: Local user management (admin only)
  - name: Host
    description: Host status and capabilities
  - name: Virtual Machines
    description: VM inventory and power operations
  - name: Storage
    description: Storage pools
  - name: Network
    description: Virtual networks
  - name: Health
    description: Liveness and readiness probes
  - name: Backup
    description: Virtual machine backup and restore
  - name: Tasks
    description: Async job system (VM creation, backups, restores)

paths:
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Authenticate and obtain a bearer token
      description: >
        Validates credentials against the local user database (SQLite) and
        returns a signed JWT bearer token. All other endpoints (except
        /health and /ready) require `Authorization: Bearer <token>`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { username: admin, password: secret }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: INVALID_CREDENTIALS, message: Invalid username or password, requestId: req_x } }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Get the authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password:
    put:
      operationId: changeOwnPassword
      tags: [Auth]
      summary: Change the authenticated user's own password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List local users
      description: Requires the `admin` role.
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      tags: [Users]
      summary: Create a local user
      description: Requires the `admin` role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Username already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: USER_ALREADY_EXISTS, message: A user with this username already exists, requestId: req_x } }

  /users/{id}:
    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Delete a local user
      description: >
        Requires the `admin` role. The caller cannot delete itself and the
        last remaining admin cannot be deleted.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: User deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Cannot delete self or the last admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: LAST_ADMIN, message: Cannot delete the last admin user, requestId: req_x } }

  /users/{id}/password:
    put:
      operationId: resetUserPassword
      tags: [Users]
      summary: Reset a user's password (admin)
      description: Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePasswordRequest' }
      responses:
        '204': { description: Password updated }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /host:
    get:
      operationId: getHost
      tags: [Host]
      summary: Get host status
      description: Returns status and identity of the hypervisor host.
      responses:
        '200':
          description: Host status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
              example:
                hostname: kvm01
                operatingSystem: Ubuntu 24.04 LTS
                kernel: 6.8.0-45-generic
                uptimeSeconds: 128934
                cpu: { model: AMD EPYC 7402P 24-Core Processor, cores: 24, threads: 48, usagePercent: 23.5 }
                memoryTotalBytes: 68719476736
                memoryUsedBytes: 21474836480
                virtualization: { kvmEnabled: true }
                qemuVersion: 8.2.0
                libvirtVersion: 10.0.0
        '500': { $ref: '#/components/responses/InternalError' }

  /capabilities:
    get:
      operationId: getCapabilities
      tags: [Host]
      summary: Get host capabilities
      description: >
        Feature discovery for UI, automation and agents. Clients must use
        this to know what the host supports instead of hardcoding assumptions.
      responses:
        '200':
          description: Host capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
              example:
                virtualization: { kvm: true, uefi: true }
                storage: { qcow2: true, raw: true, snapshots: true }
                features: { backup: false, migration: false, cloudInit: false }
        '500': { $ref: '#/components/responses/InternalError' }

  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Liveness probe
      security: []
      description: Checks only that the application process is alive. Always returns 200 while the process is up.
      responses:
        '200':
          description: Application is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok }

  /ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Readiness probe
      security: []
      description: Checks that the application and the HypervisorProvider are ready to serve requests.
      responses:
        '200':
          description: Ready to serve traffic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              example: { status: ready, hypervisor: ready }
        '503':
          description: Not ready (e.g. hypervisor provider unavailable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              example: { status: not-ready, hypervisor: unavailable }

  /storage/pools:
    get:
      operationId: listStoragePools
      tags: [Storage]
      summary: List storage pools
      responses:
        '200':
          description: Storage pools
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoragePoolList' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createStoragePool
      tags: [Storage]
      summary: Create a storage pool
      description: |
        Defines, builds and starts a new directory-based storage pool.
        The target directory is created if it does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoragePoolCreate' }
            example: { name: iso-store, targetPath: /var/lib/libvirt/isos, autostart: true }
      responses:
        '201':
          description: Pool created (returns the pool)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoragePool' }
        '400':
          description: Validation error (name/targetPath)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: A pool with this name already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: STORAGE_POOL_ALREADY_EXISTS, message: A storage pool with this name already exists, requestId: req_01HV3M9Z2K2Q } }
        '500': { $ref: '#/components/responses/InternalError' }

  /storage/pools/{id}:
    get:
      operationId: getStoragePool
      tags: [Storage]
      summary: Get a storage pool
      parameters: [ { $ref: '#/components/parameters/ResourceID' } ]
      responses:
        '200':
          description: Storage pool details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoragePool' }
        '404':
          description: Storage pool not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteStoragePool
      tags: [Storage]
      summary: Remove a storage pool from the listing
      description: >
        Undefines the storage pool (deactivating it first if needed) so it disappears from
        the listing. No data is deleted: volumes, disk images and files on disk are kept intact.
      parameters: [ { $ref: '#/components/parameters/ResourceID' } ]
      responses:
        '204': { description: Pool removed from the listing (data untouched) }
        '404':
          description: Storage pool not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /storage/pools/{id}/refresh:
    post:
      operationId: refreshStoragePool
      tags: [Storage]
      summary: Refresh a storage pool
      description: Re-syncs the pool's volume list and usage numbers with the backing storage.
      parameters: [ { $ref: '#/components/parameters/ResourceID' } ]
      responses:
        '200':
          description: Pool refreshed (returns updated pool)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoragePool' }
        '404':
          description: Storage pool not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /storage/isos:
    get:
      operationId: listIsos
      tags: [Storage]
      summary: List ISO images in the library
      description: |
        ISO images available as installation media. Backed by a dedicated
        directory on the host (ULTRAV_ISO_DIR). Files are uploaded via the
        browser with `uploadIso`.
      responses:
        '200':
          description: ISO images
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IsoList' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: uploadIso
      tags: [Storage]
      summary: Upload an ISO image
      description: Streams the file into the ISO library. The filename must end in `.iso`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: ISO uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Iso' }
        '400':
          description: Invalid file (must be a .iso file)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: An ISO with this filename already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /storage/isos/{id}:
    delete:
      operationId: deleteIso
      tags: [Storage]
      summary: Delete an ISO image
      description: Removes the file from the ISO library.
      parameters: [ { $ref: '#/components/parameters/ResourceID' } ]
      responses:
        '204':
          description: ISO deleted
        '404':
          description: ISO not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /networks:
    get:
      operationId: listNetworks
      tags: [Network]
      summary: List virtual networks
      responses:
        '200':
          description: Virtual networks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkList' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createNetwork
      tags: [Network]
      summary: Create a virtual network
      description: |
        Creates a virtual network in one of three modes:
        - `nat`: routed + NAT subnet managed by libvirt (DHCP + dnsmasq)
        - `bridge`: passthrough to an existing host bridge (VMs get IPs on the
          host's LAN; requires a bridge such as br0 configured on the host --
          libvirt cannot create host bridges)
        - `isolated`: internal-only subnet, no outside connectivity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkCreate' }
      responses:
        '201':
          description: Network created (and started)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '400':
          description: Invalid input (missing bridgeName for bridge mode, bad CIDR, ...)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: A network with this name already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /host/bridges:
    get:
      operationId: listHostBridges
      tags: [Network]
      summary: List host bridge interfaces
      description: |
        Host Linux bridges (e.g. br0) that virtual networks in `bridge` mode can
        attach to. Creating these bridges is host configuration (netplan /
        NetworkManager), not something libvirt or UltraV does; use this list to
        detect what exists and guide the user when nothing is available.
      responses:
        '200':
          description: Host bridges (may be empty)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostBridgeList' }
        '500': { $ref: '#/components/responses/InternalError' }

  /networks/{id}:
    put:
      operationId: updateNetwork
      tags: [Network]
      summary: Update a virtual network
      description: |
        Updates a virtual network's persistent definition. Fields left null
        keep their current value. Structural changes (mode, bridgeName, cidr,
        dhcpEnabled) require the network to be inactive (409 otherwise);
        `autostart` can be changed at any time. The network name is immutable.
      parameters: [ { $ref: '#/components/parameters/ResourceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkUpdate' }
      responses:
        '200':
          description: Updated network
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '400':
          description: Invalid input (bad CIDR, missing bridgeName for bridge mode, ...)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Network not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Network is active (stop it before structural changes)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteNetwork
      tags: [Network]
      summary: Delete a virtual network
      description: |
        Undefines the virtual network. The network must be inactive
        (409 otherwise). VMs keep their interface definitions but lose
        connectivity through this network.
      parameters: [ { $ref: '#/components/parameters/ResourceID' } ]
      responses:
        '204':
          description: Network deleted
        '404':
          description: Network not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Network is active (stop it before deleting)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: getNetwork
      tags: [Network]
      summary: Get a virtual network
      parameters: [ { $ref: '#/components/parameters/ResourceID' } ]
      responses:
        '200':
          description: Network details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '404':
          description: Network not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /networks/{id}/start:
    post:
      operationId: startNetwork
      tags: [Network]
      summary: Start a virtual network
      parameters: [ { $ref: '#/components/parameters/ResourceID' } ]
      responses:
        '200':
          description: Network started (returns updated network)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '404':
          description: Network not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Network is already active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /networks/{id}/stop:
    post:
      operationId: stopNetwork
      tags: [Network]
      summary: Stop a virtual network
      description: |
        Stops the virtual network. Running VMs attached to it keep working but
        lose new DHCP leases and NAT until the network is started again.
      parameters: [ { $ref: '#/components/parameters/ResourceID' } ]
      responses:
        '200':
          description: Network stopped (returns updated network)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '404':
          description: Network not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Network is already inactive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms:
    get:
      operationId: listVirtualMachines
      tags: [Virtual Machines]
      summary: List virtual machines
      responses:
        '200':
          description: Virtual machines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachineList' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createVirtualMachine
      tags: [Virtual Machines]
      summary: Create a virtual machine
      description: |
        Defines a new virtual machine: allocates a disk volume in the chosen
        storage pool and defines the domain (left stopped unless `start` is
        true). The VM is not booted from an OS image — attach installation
        media with virt-install/virt-manager afterwards if needed.

        The `osType` selects a performance profile applied to the generated
        domain XML:

        - **linux** (default): virtio-scsi disk on an iothread-ed controller
          (`cache='none'`, `io='native'`, `discard='unmap'`), virtio NIC with
          vhost multi-queue, `cpu mode='host-passthrough'` (note: limits live
          migration between hosts with different CPUs — relevant for the
          future multi-host phase), guest agent channel, memballoon disabled,
          catchup timers and a virtio RNG.
        - **windows**: everything from the linux profile plus Hyper-V
          enlightenments (relaxed, vapic, spinlocks, vpindex, synic, stimer,
          runtime, frequencies, reset, tlbflush, ipi — only the ones supported
          by the host's QEMU/libvirt are included), `clock offset='localtime'`
          with hypervclock timer. If `virtioDriversIsoId` is set, the VirtIO
          drivers ISO is attached as a second SATA CD-ROM so the Windows
          installer can load `vioscsi`/`NetKVM`. Without it, creation still
          succeeds but `warnings[]` in the response explains the installer
          will not see the virtio-scsi disk.
        - **other**: maximum compatibility — SATA disk, e1000e NIC,
          `cpu mode='host-model'`, no enlightenments. Use for exotic guests or
          a first boot of a converted VHDX without virtio drivers.

        The NIC model follows the profile (`virtio`, or `e1000e` for `other`)
        unless `nicModel` overrides it. A Windows guest on a `virtio` NIC has
        no network until NetKVM is installed from the VirtIO drivers ISO; the
        response says so in `warnings[]`.

        The applied profile is reported back in the returned VM's
        `performanceProfile`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VirtualMachineCreate' }
            example:
              name: app01
              vcpus: 2
              memoryBytes: 4294967296
              disk:
                poolId: default
                sizeBytes: 42949672960
                format: qcow2
              networkId: default
              start: false
      responses:
        '202':
          description: |
            Creation accepted and running in the background as a task
            (volume allocation + domain definition). Poll `GET /tasks/{id}`
            until the status is `succeeded` or `failed`; profile warnings
            (e.g. VirtIO drivers missing for Windows) are reported in the
            task's `warnings[]`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: Invalid create specification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms/{id}:
    get:
      operationId: getVirtualMachine
      tags: [Virtual Machines]
      summary: Get a virtual machine
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      responses:
        '200':
          description: Virtual machine details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachine' }
        '404': { $ref: '#/components/responses/VMNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateVirtualMachine
      tags: [Virtual Machines]
      summary: Update virtual machine settings
      description: >
        Changes the VM's hardware configuration: vCPU count, memory size and
        the attached ISO (install media). Only the fields present in the body
        are changed (partial update). vCPU and memory changes require the VM
        to be stopped; the ISO can be swapped in any state and takes effect on
        the next boot.
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VirtualMachineUpdate' }
            example: { vcpus: 4, memoryBytes: 8589934592, isoId: '' }
      responses:
        '200':
          description: Updated virtual machine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachine' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/VMNotFound' }
        '409': { $ref: '#/components/responses/VMInvalidState' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteVirtualMachine
      tags: [Virtual Machines]
      summary: Delete a virtual machine
      description: |
        Removes a virtual machine. Two levels of deletion are supported via
        the deleteDisks query parameter:

        * `deleteDisks=false` (default): undefines only the domain
          configuration. The disk volumes remain in the storage pool and can
          be reclaimed or reused manually.
        * `deleteDisks=true`: undefines the domain AND deletes its disk
          volumes from the storage pool, freeing the space.

        The VM must be stopped (409 otherwise).
      parameters:
        - { $ref: '#/components/parameters/VMId' }
        - name: deleteDisks
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Also delete the VM's disk volumes from the storage pool.
      responses:
        '204': { description: Virtual machine deleted }
        '404': { $ref: '#/components/responses/VMNotFound' }
        '409': { $ref: '#/components/responses/VMInvalidState' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms/{id}/start:
    post:
      operationId: startVirtualMachine
      tags: [Virtual Machines]
      summary: Start a virtual machine
      description: |
        Powers on a stopped virtual machine. Returns 409 if already running.

        Also 409, with code `STORAGE_UNAVAILABLE`, when the hypervisor cannot
        open a file the domain references (installation ISO, disk volume). The
        message names the path. This is a host configuration problem, not a
        transient fault: it usually means the backend runs in a container and
        the directory is not mounted at an identical path on the host, so the
        file is reachable from the API but not from qemu.
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      responses:
        '200':
          description: VM started (returns updated VM)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachine' }
        '404': { $ref: '#/components/responses/VMNotFound' }
        '409': { $ref: '#/components/responses/VMInvalidState' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms/{id}/console:
    get:
      operationId: openVMConsole
      tags: [Virtual Machines]
      summary: Open the VM graphical console (WebSocket)
      description: |
        Upgrades the connection to a WebSocket and proxies binary frames to the
        VM's graphical console (VNC/RFB). The browser side is a noVNC client;
        binary messages are raw VNC octets. Requires a running VM (409 otherwise).
        Note: this endpoint is a WebSocket — OpenAPI cannot fully describe the
        upgraded protocol.
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      responses:
        '101':
          description: Switching Protocols — WebSocket established, frames are raw VNC
        '404': { $ref: '#/components/responses/VMNotFound' }
        '409': { $ref: '#/components/responses/VMInvalidState' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms/{id}/shutdown:
    post:
      operationId: shutdownVirtualMachine
      tags: [Virtual Machines]
      summary: Gracefully shut down a virtual machine
      description: Sends an ACPI shutdown event. The guest OS should shut down cleanly.
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      responses:
        '200':
          description: Shutdown requested (returns updated VM)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachine' }
        '404': { $ref: '#/components/responses/VMNotFound' }
        '409': { $ref: '#/components/responses/VMInvalidState' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms/{id}/reboot:
    post:
      operationId: rebootVirtualMachine
      tags: [Virtual Machines]
      summary: Reboot a virtual machine
      description: Sends an ACPI reboot event. Returns 409 if the VM is not running.
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      responses:
        '200':
          description: Reboot requested (returns updated VM)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachine' }
        '404': { $ref: '#/components/responses/VMNotFound' }
        '409': { $ref: '#/components/responses/VMInvalidState' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms/{id}/stop:
    post:
      operationId: forceStopVirtualMachine
      tags: [Virtual Machines]
      summary: Force stop a virtual machine
      description: |
        Immediately powers off the VM, equivalent to pulling the power cable.
        The guest OS is not given a chance to shut down cleanly; data loss or
        filesystem corruption is possible. Prefer `shutdownVirtualMachine`.
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      responses:
        '200':
          description: VM force stopped (returns updated VM)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachine' }
        '404': { $ref: '#/components/responses/VMNotFound' }
        '409': { $ref: '#/components/responses/VMInvalidState' }
        '500': { $ref: '#/components/responses/InternalError' }

  /backup-schedules:
    get:
      operationId: listBackupSchedules
      tags: [Backup Schedules]
      summary: List backup schedules
      responses:
        '200':
          description: Schedules (creation order)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupScheduleList' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createBackupSchedule
      tags: [Backup Schedules]
      summary: Create a backup schedule
      description: |
        Defines a recurring backup job: every day at `time` (server local
        time) the scheduler backs up the target VMs and then applies the
        retention policy (keeps the newest `retentionKeepLast` full chains;
        points older than that are deleted together with their checkpoints).

        The type follows the backup semantics: `auto` picks incremental when
        a chain is valid, full otherwise; a stopped VM always takes a full.
        Use `vmIds: ["*"]` to target every VM present at run time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupScheduleCreate' }
            example:
              name: nightly
              time: '03:00'
              vmIds: ['*']
              type: auto
              retentionKeepLast: 7
              enabled: true
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupSchedule' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: A schedule with this name already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /backup-schedules/{id}:
    put:
      operationId: updateBackupSchedule
      tags: [Backup Schedules]
      summary: Update a backup schedule
      description: Partial update — only the fields present in the body change. `name` and `id` are immutable.
      parameters: [ { $ref: '#/components/parameters/ScheduleId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupScheduleUpdate' }
            example: { enabled: false }
      responses:
        '200':
          description: Updated schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupSchedule' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/ScheduleNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteBackupSchedule
      tags: [Backup Schedules]
      summary: Delete a backup schedule
      description: Removes the schedule definition. Existing backup points are not touched.
      parameters: [ { $ref: '#/components/parameters/ScheduleId' } ]
      responses:
        '204': { description: Schedule deleted }
        '404': { $ref: '#/components/responses/ScheduleNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms/{id}/backups:
    get:
      operationId: listVMBackups
      tags: [Backup]
      summary: List backups of a virtual machine
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      responses:
        '200':
          description: Backup points of this VM (newest first)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupList' }
        '404': { $ref: '#/components/responses/VMNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createVMBackup
      tags: [Backup]
      summary: Create a backup of a virtual machine (full or incremental)
      description: |
        Backs up every disk of the VM plus its domain configuration.

        By default the engine picks the point type automatically:
        **incremental** when a valid backup chain exists (previous point's
        checkpoint present in the domain — only dirty blocks since the last
        backup are copied, via libvirt checkpoints / QEMU dirty bitmaps),
        otherwise **full**. Pass `{"type": "full"}` to force a full backup
        and reset the chain.

        Works with the VM running or stopped. When running, the backup is
        crash-consistent (block-level snapshot taken by the hypervisor via
        `virDomainBackupBegin`); for application-consistent backups of
        databases, shut the VM down or quiesce it first (guest-agent fsfreeze
        integration arrives in a later phase). An offline (stopped) backup is
        always full.

        The call is synchronous: it returns when the copy completes. Disk
        images are stored as qcow2 in the server's backup directory
        (`ULTRAV_BACKUP_DIR`, default `/var/lib/ultrav/backups`), one folder
        per backup point, alongside a `metadata.json` and the saved
        `domain.xml`.
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupCreate' }
            example: { type: incremental }
      responses:
        '202':
          description: |
            Backup accepted and running in the background as a task. Poll
            `GET /tasks/{id}` until the status is `succeeded` or `failed`;
            the finished task's `resourceId` is the backup point id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/VMNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /backups/{id}:
    delete:
      operationId: deleteBackup
      tags: [Backup]
      summary: Delete a backup point
      description: Permanently removes the backup point's directory (disk images, metadata and saved domain XML). Does not touch the VM.
      parameters:
        - name: id
          in: path
          required: true
          description: Backup identifier (`bk-...`).
          schema: { type: string, pattern: '^bk-[a-zA-Z0-9._-]{1,80}$', example: bk-20250901-120000-a1b2 }
      responses:
        '204': { description: Backup deleted }
        '404': { $ref: '#/components/responses/BackupNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /backups/{id}/restore:
    post:
      operationId: restoreBackup
      tags: [Backup]
      summary: Restore a backup into its virtual machine
      description: |
        Overwrites the disks of the VM the backup was taken from with the
        backup's disk images, and restores the saved domain configuration.
        Incremental points are restored by replaying the whole chain
        (full → incrementals, oldest first). The VM must exist and be stopped
        (409 otherwise) — restore is destructive: the current disk contents
        are replaced.

        After a restore the backup chain is reset: the next backup will be a
        new full (the domain's dirty-bitmap checkpoints are deleted, since
        the disks now reflect an older point in time).

        The restored VM reflects the state captured by the backup (hardware
        settings come from the saved `domain.xml`). Backups of VMs that no
        longer exist cannot be restored in this phase (delete the old VM
        metadata manually or wait for restore-as-new-VM).
      parameters:
        - name: id
          in: path
          required: true
          description: Backup identifier (`bk-...`).
          schema: { type: string, pattern: '^bk-[a-zA-Z0-9._-]{1,80}$', example: bk-20250901-120000-a1b2 }
      responses:
        '202':
          description: |
            Restore accepted and running in the background as a task. Poll
            `GET /tasks/{id}` until the status is `succeeded` or `failed`.
            Failure reasons (VM running, backup's VM no longer exists) are
            reported in the task's `error`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/BackupNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms/{id}/config-export:
    get:
      operationId: exportVMConfig
      tags: [Backup]
      summary: Export the VM configuration (domain XML)
      description: Returns the libvirt domain XML of the VM, for configuration backup / disaster recovery. Cheap to call; pair it with backups for full-VM restore on a blank host.
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      responses:
        '200':
          description: Domain XML (content type application/xml)
          content:
            application/xml:
              schema: { type: string }
        '404': { $ref: '#/components/responses/VMNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: List async tasks
      description: |
        Task history (newest first). Tasks are kept in memory: the list is
        reset when the backend restarts. Terminal tasks (succeeded, failed,
        cancelled) can be listed to audit what happened; use the `status`
        query filter and `limit` to control the result size.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Tasks (newest first)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [Tasks]
      summary: Get a task
      description: Poll this endpoint to follow a task until it reaches a terminal status.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404':
          description: Task not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /tasks/{id}/cancel:
    post:
      operationId: cancelTask
      tags: [Tasks]
      summary: Cancel a task
      description: |
        Requests cancellation of a queued or running task. The operation
        behind it is cancelled through its context; the task moves to
        `cancelling` and reaches `cancelled` when the worker returns
        (409 if the task already finished). Tasks that cannot be aborted
        report `cancellable: false`.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '202':
          description: Cancellation requested (returns the task)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404':
          description: Task not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Task already reached a terminal state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

security:
  - bearerAuth: []

components:
  parameters:
    ScheduleId:
      name: id
      in: path
      required: true
      description: Backup schedule identifier (`sch-...`).
      schema: { type: string, pattern: '^sch-[a-zA-Z0-9._-]{1,60}$', example: sch-nightly }

    TaskId:
      name: id
      in: path
      required: true
      description: Task identifier (`task-...`).
      schema: { type: string, pattern: '^task-[a-zA-Z0-9._-]{1,64}$', example: task-000001 }

    VMId:
      name: id
      in: path
      required: true
      description: Virtual machine identifier (name).
      schema: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$', example: erp01 }

    ResourceID:
      name: id
      in: path
      required: true
      description: Resource identifier (libvirt name).
      schema: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$', example: default }

    UserId:
      name: id
      in: path
      required: true
      description: Numeric user identifier.
      schema: { type: integer, minimum: 1, example: 2 }

  responses:
    VMNotFound:
      description: Virtual machine not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: VM_NOT_FOUND, message: Virtual machine was not found, requestId: req_01HV3M9Z2K }
    VMInvalidState:
      description: Operation not valid for the current VM state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: VM_INVALID_STATE, message: Virtual machine is not running, requestId: req_01HV3M9Z2L }
    BackupNotFound:
      description: Backup point not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: BACKUP_NOT_FOUND, message: Backup was not found, requestId: req_x } }
    ScheduleNotFound:
      description: Backup schedule not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: SCHEDULE_NOT_FOUND, message: Backup schedule was not found, requestId: req_x } }
    InternalError:
      description: Internal server error (no internal details are exposed)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: INTERNAL_ERROR, message: An internal error occurred, requestId: req_01HV3M9Z2M }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: UNAUTHORIZED, message: Authentication required, requestId: req_01HV3M9Z2N }

    Forbidden:
      description: Admin role required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: FORBIDDEN, message: Admin role required, requestId: req_x } }
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: VALIDATION_ERROR, message: username and password are required, requestId: req_x } }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, format: password, example: secret }

    LoginResponse:
      type: object
      required: [token, tokenType, expiresInSeconds, user]
      properties:
        token: { type: string, description: JWT bearer token, example: eyJhbGciOi... }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer, example: 86400 }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      required: [id, username, role, createdAt]
      properties:
        id: { type: integer, example: 1 }
        username: { type: string, example: admin }
        role: { type: string, enum: [admin, viewer], example: admin }
        createdAt:
          type: string
          format: date-time
          example: '2025-09-01T12:00:00Z'
    UserList:
      type: object
      required: [total, items]
      properties:
        total: { type: integer, example: 2 }
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }

    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string, minLength: 1, maxLength: 64, example: alice }
        password: { type: string, format: password, minLength: 8, example: secret }
        role: { type: string, enum: [admin, viewer], example: viewer }

    UpdatePasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, minLength: 8, example: new-secret }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password, example: secret }
        newPassword: { type: string, format: password, minLength: 8, example: new-secret }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              example: VM_NOT_FOUND
              description: >
                Stable error identifier. Known values: VM_NOT_FOUND, VM_INVALID_STATE,
                VM_ALREADY_EXISTS, VALIDATION_ERROR, NOT_FOUND, METHOD_NOT_ALLOWED,
                STORAGE_POOL_NOT_FOUND, STORAGE_POOL_ALREADY_EXISTS, NETWORK_NOT_FOUND,
                NETWORK_INVALID_STATE, NETWORK_INACTIVE (a virtual network a VM references
                is not active — start it before powering on the VM), NETWORK_ALREADY_EXISTS,
                ISO_NOT_FOUND, ISO_ALREADY_EXISTS, UNAUTHORIZED, INVALID_CREDENTIALS,
                FORBIDDEN, USER_NOT_FOUND, USER_ALREADY_EXISTS, LAST_ADMIN,
                CONSOLE_UNAVAILABLE, STORAGE_UNAVAILABLE (the hypervisor cannot open a file
                the domain references), KVM_UNAVAILABLE (hardware virtualization missing or
                inaccessible on the host), BACKUP_NOT_FOUND, BACKUP_INVALID_STATE (the backup's
                VM is running or no longer exists — stop the VM first), SCHEDULE_NOT_FOUND,
                TASK_NOT_FOUND, TASK_NOT_CANCELLABLE (the task already reached a
                terminal state), INTERNAL_ERROR.
            message: { type: string, example: Virtual machine was not found }
            requestId: { type: string, example: req_01HV3M9Z2K }

    Host:
      type: object
      required: [hostname, operatingSystem, kernel, uptimeSeconds, cpu, memoryTotalBytes, memoryUsedBytes]
      properties:
        hostname: { type: string, example: kvm01 }
        operatingSystem: { type: string, example: Ubuntu 24.04 LTS }
        kernel: { type: string, example: 6.8.0-45-generic }
        uptimeSeconds: { type: integer, example: 128934 }
        cpu: { $ref: '#/components/schemas/Cpu' }
        memoryTotalBytes: { type: integer, format: int64, example: 68719476736 }
        memoryUsedBytes: { type: integer, format: int64, example: 21474836480 }
        virtualization: { $ref: '#/components/schemas/HostVirtualization' }
        storageTotalBytes: { type: integer, format: int64, example: 2199023255552 }
        storageUsedBytes: { type: integer, format: int64, example: 789128484864 }
        qemuVersion: { type: string, example: 8.2.0 }
        libvirtVersion: { type: string, example: 10.0.0 }

    Cpu:
      type: object
      required: [model, cores, threads]
      properties:
        model: { type: string, example: AMD EPYC 7402P 24-Core Processor }
        cores: { type: integer, example: 24 }
        threads: { type: integer, example: 48 }
        usagePercent: { type: number, format: float, example: 23.5 }

    HostVirtualization:
      type: object
      properties:
        kvmEnabled: { type: boolean, example: true }

    VirtualMachineList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/VirtualMachine' }
        total: { type: integer, example: 4 }

    Network:
      type: object
      required: [id, name, state, autostart, dhcpEnabled]
      properties:
        id: { type: string, example: default }
        name: { type: string, example: default }
        state: { type: string, enum: [active, inactive], example: active }
        autostart: { type: boolean, example: true }
        bridge: { type: string, nullable: true, example: virbr0 }
        ipAddress: { type: string, nullable: true, example: 10.0.0.1 }
        ipPrefix: { type: integer, nullable: true, example: 24 }
        dhcpEnabled: { type: boolean, example: true }
        domainName: { type: string, nullable: true, example: default }
        mode: { type: string, enum: [nat, bridge, isolated], example: nat }

    NetworkCreate:
      type: object
      required: [name, mode]
      properties:
        name: { type: string, example: lan }
        mode:
          type: string
          enum: [nat, bridge, isolated]
          example: nat
        bridgeName:
          type: string
          nullable: true
          example: br0
          description: Host bridge to attach to (required when mode is bridge).
        cidr:
          type: string
          nullable: true
          example: 192.168.100.0/24
          description: Subnet for nat/isolated modes (required for those modes).
        dhcpEnabled: { type: boolean, nullable: true, example: true }
        autostart: { type: boolean, nullable: true, example: true }

    NetworkUpdate:
      type: object
      description: Fields left null keep their current value.
      properties:
        mode:
          type: string
          enum: [nat, bridge, isolated]
          example: nat
        bridgeName:
          type: string
          nullable: true
          example: br0
          description: Host bridge to attach to (required when mode is bridge).
        cidr:
          type: string
          nullable: true
          example: 192.168.100.0/24
          description: Subnet for nat/isolated modes (required for those modes).
        dhcpEnabled: { type: boolean, nullable: true, example: true }
        autostart: { type: boolean, nullable: true, example: true }

    HostBridge:
      type: object
      required: [name, active]
      properties:
        name: { type: string, example: br0 }
        active: { type: boolean, example: true }

    HostBridgeList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HostBridge' }
        total: { type: integer, example: 1 }

    NetworkList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Network' }
        total: { type: integer, example: 2 }

    StoragePool:
      type: object
      required: [id, name, type, state, capacityBytes, allocationBytes, availableBytes]
      properties:
        id: { type: string, example: default }
        name: { type: string, example: default }
        type: { type: string, enum: [dir, fs, netfs, lvm, disk, iscsi, zfs, rbd, other], example: dir }
        state: { type: string, enum: [active, inactive], example: active }
        autostart: { type: boolean, example: true }
        capacityBytes: { type: integer, format: int64, example: 2199023255552 }
        allocationBytes: { type: integer, format: int64, example: 789128484864 }
        availableBytes: { type: integer, format: int64, example: 1409894770688 }
        targetPath: { type: string, nullable: true, example: /var/lib/libvirt/images }

    StoragePoolCreate:
      type: object
      required: [name, targetPath]
      properties:
        name: { type: string, example: iso-store, description: Same rules as resource ids (a-z0-9._-, max 64) }
        type: { type: string, enum: [dir], default: dir, example: dir, description: Only directory pools are supported for now }
        targetPath: { type: string, example: /var/lib/libvirt/isos, description: Absolute host path; created if missing }
        autostart: { type: boolean, default: true, example: true }
        isoLibrary: { type: boolean, default: false, example: true, description: When true, also points the ISO library at targetPath — existing .iso files in that directory become available in the ISO library and to the VM wizard. Persists across restarts. }

    StoragePoolList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StoragePool' }
        total: { type: integer, example: 2 }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok], example: ok }

    Readiness:
      type: object
      required: [status, hypervisor]
      properties:
        status: { type: string, enum: [ready, not-ready], example: ready }
        hypervisor: { type: string, enum: [ready, unavailable], example: ready }

    Capabilities:
      type: object
      required: [virtualization, storage, features]
      properties:
        virtualization: { $ref: '#/components/schemas/CapabilitiesVirtualization' }
        storage: { $ref: '#/components/schemas/CapabilitiesStorage' }
        features: { $ref: '#/components/schemas/CapabilitiesFeatures' }

    CapabilitiesVirtualization:
      type: object
      required: [kvm, uefi]
      properties:
        kvm: { type: boolean }
        uefi: { type: boolean }

    CapabilitiesStorage:
      type: object
      required: [qcow2, raw, snapshots]
      properties:
        qcow2: { type: boolean }
        raw: { type: boolean }
        snapshots: { type: boolean }

    CapabilitiesFeatures:
      type: object
      required: [backup, migration, cloudInit]
      properties:
        backup: { type: boolean, example: false }
        migration: { type: boolean, example: false }
        cloudInit: { type: boolean, example: false }

    VMState:
      type: string
      enum: [running, stopped, paused, shutting-down, starting, error]
      description: |
        - running: powered on and operational
        - stopped: powered off
        - shutting-down: graceful shutdown in progress
        - starting: power-on in progress

    VirtualMachineCreate:
      type: object
      required: [name, vcpus, memoryBytes, disk]
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$'
          example: app01
        vcpus: { type: integer, minimum: 1, maximum: 64, example: 2 }
        memoryBytes:
          type: integer
          format: int64
          minimum: 16777216
          example: 4294967296
        disk: { $ref: '#/components/schemas/DiskCreate' }
        networkId: { type: string, example: default }
        isoId:
          type: string
          nullable: true
          description: Optional ISO from the library to attach as install media (CD-ROM, first boot device).
          example: ubuntu-24.04-live-server.iso
        osType:
          type: string
          enum: [linux, windows, other]
          default: linux
          description: |
            Guest operating system family, selects the performance profile
            applied to the domain XML (see endpoint description).
          example: windows
        virtioDriversIsoId:
          type: string
          nullable: true
          description: |
            Optional VirtIO drivers ISO from the library (e.g.
            `virtio-win-0.1.266.iso`), attached as a second SATA CD-ROM for
            Windows installations. Only meaningful when `osType` is `windows`;
            ignored otherwise. Without it the Windows installer cannot see the
            virtio-scsi disk unless drivers are loaded from another source.
          example: virtio-win-0.1.266.iso
        nicModel:
          type: string
          enum: [virtio, e1000e, rtl8139]
          nullable: true
          description: |
            Network adapter model. Omitted, it follows the `osType` profile:
            `virtio` for linux/windows, `e1000e` for other.

            `virtio` is the fastest but needs a driver in the guest. Linux has
            it in-tree; **Windows does not** — the NIC stays unusable (device
            error 43 or an unknown Ethernet controller) until NetKVM is
            installed from the VirtIO drivers ISO. Pick `e1000e` for a Windows
            guest that must have network on first boot, or `rtl8139` for very
            old guests without an e1000e driver.
          example: e1000e
        start: { type: boolean, description: Power on immediately after creation., example: false }

    VirtualMachineUpdate:
      type: object
      description: >
        Partial update of a VM's settings. Only provided fields are changed.
        vCPU and memory require the VM to be stopped. For isoId, a filename
        attaches/swaps the install media and an empty string detaches it.
      properties:
        vcpus:
          type: integer
          minimum: 1
          maximum: 64
          example: 4
        memoryBytes:
          type: integer
          format: int64
          minimum: 16777216
          example: 8589934592
        isoId:
          type: string
          description: ISO filename from the library to attach/swap; an empty string detaches the current ISO.
          example: ubuntu-24.04-live-server.iso
        networkId:
          type: string
          description: |
            Moves the VM's network interface to another virtual network.
            Requires the VM to be stopped (applied to the persistent config).
          example: br0

    DiskCreate:
      type: object
      required: [poolId, sizeBytes]
      properties:
        poolId: { type: string, example: default }
        sizeBytes:
          type: integer
          format: int64
          minimum: 1048576
          example: 42949672960
        format: { type: string, enum: [qcow2, raw], example: qcow2 }

    Iso:
      type: object
      required: [id, fileName, sizeBytes]
      properties:
        id: { type: string, example: ubuntu-24.04-live-server.iso }
        fileName: { type: string, example: ubuntu-24.04-live-server.iso }
        sizeBytes: { type: integer, format: int64, example: 2197821440 }
        uploadedAt:
          type: string
          format: date-time
          example: '2025-09-01T12:00:00Z'

    IsoList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Iso' }
        total: { type: integer, example: 2 }

    Backup:
      type: object
      required: [id, vmId, vmName, type, createdAt, sizeBytes, disks]
      properties:
        id: { type: string, example: bk-20250901-120000-a1b2 }
        vmId: { type: string, example: erp01 }
        vmName: { type: string, example: erp01 }
        type:
          type: string
          enum: [full, incremental]
          example: incremental
          description: |
            `full` copies every disk in full and resets the chain;
            `incremental` copies only the blocks modified since the previous
            point (requires a valid chain, i.e. the parent's checkpoint still
            exists in the domain).
        parentId:
          type: string
          nullable: true
          description: For incremental points, the id of the backup this one continues from.
          example: bk-20250831-120000-c3d4
        state: { type: string, enum: [complete], example: complete }
        createdAt:
          type: string
          format: date-time
          example: '2025-09-01T12:00:00Z'
        sizeBytes:
          type: integer
          format: int64
          description: Total size of the backup's disk images on the backup storage.
          example: 34359738368
        disks:
          type: array
          items: { $ref: '#/components/schemas/BackupDisk' }
        hasDomainXml: { type: boolean, example: true }

    BackupCreate:
      type: object
      properties:
        type:
          type: string
          enum: [full, incremental]
          description: |
            Force the point type. `incremental` fails with 409
            `BACKUP_INVALID_STATE` when no valid chain exists (e.g. after a
            restore or if the parent checkpoint was deleted). Absent = auto
            (incremental when a chain is valid, full otherwise).
          example: incremental

    BackupSchedule:
      type: object
      required: [id, name, time, vmIds, type, retentionKeepLast, enabled]
      properties:
        id: { type: string, example: sch-8f3a2b1c }
        name: { type: string, example: nightly }
        time:
          type: string
          description: Daily run time, server local time (HH:MM).
          example: '03:00'
        vmIds:
          type: array
          items: { type: string }
          description: Target VM names, or `["*"]` for every VM at run time.
          example: ['*']
        type:
          type: string
          enum: [auto, full, incremental]
          description: Point type policy applied on each run.
          example: auto
        retentionKeepLast:
          type: integer
          description: |
            Number of full chains to keep (each chain = a full backup plus
            the incrementals on top of it). 0 disables pruning.
          example: 7
        enabled: { type: boolean, example: true }
        lastRun:
          type: string
          format: date-time
          nullable: true
          description: When the schedule last fired (null = never).
          example: '2025-09-01T03:00:00Z'

    BackupScheduleList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BackupSchedule' }
        total: { type: integer, example: 1 }

    BackupScheduleCreate:
      type: object
      required: [name, time, vmIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, example: nightly }
        time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Daily run time, server local time (HH:MM).
          example: '03:00'
        vmIds:
          type: array
          items: { type: string }
          minItems: 1
          description: Target VM names, or `["*"]` for every VM.
          example: ['*']
        type:
          type: string
          enum: [auto, full, incremental]
          default: auto
        retentionKeepLast:
          type: integer
          default: 0
          minimum: 0
        enabled:
          type: boolean
          default: true

    BackupScheduleUpdate:
      type: object
      description: Partial update; only present fields change (name/id immutable).
      properties:
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '04:30' }
        vmIds:
          type: array
          items: { type: string }
        type: { type: string, enum: [auto, full, incremental] }
        retentionKeepLast: { type: integer, minimum: 0 }
        enabled: { type: boolean }

    BackupDisk:
      type: object
      required: [name, file, sizeBytes]
      properties:
        name: { type: string, example: vda }
        file: { type: string, example: vda.qcow2 }
        format: { type: string, enum: [qcow2, raw], example: qcow2 }
        sizeBytes: { type: integer, format: int64, example: 34359738368 }

    BackupList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Backup' }
        total: { type: integer, example: 3 }

    Disk:
      type: object
      required: [name, format, sizeBytes]
      properties:
        name: { type: string, example: vda }
        format: { type: string, enum: [qcow2, raw], example: qcow2 }
        sizeBytes: { type: integer, format: int64, example: 128849018880 }
        usedBytes:
          type: integer
          format: int64
          nullable: true
          description: >
            Space currently allocated for this disk on the host (the backing
            volume's allocation, not the guest filesystem usage). Null when the
            hypervisor cannot report it.
          example: 34359738368
        bus: { type: string, enum: [virtio, sata, scsi], example: virtio }

    VmMetrics:
      type: object
      description: >
        Point-in-time resource utilization of a running virtual machine. The
        whole object is absent while the VM is not running. Individual fields
        are null when the host cannot report them (e.g. no balloon driver /
        guest agent, or a first sample with no previous sample to diff
        against). Values are computed by the hypervisor provider, which is
        allowed to keep a short-lived sampling cache per VM.
      required:
        [cpuPercent, memoryUsedBytes, networkRxBytesPerSecond, networkTxBytesPerSecond, sampledAt]
      properties:
        cpuPercent:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 100
          description: CPU utilization relative to the VM's allocated vCPUs.
          example: 12.5
        memoryUsedBytes:
          type: integer
          format: int64
          nullable: true
          description: >
            Guest memory currently in use. Null unless the guest balloon
            driver or agent reports it.
          example: 3221225472
        networkRxBytesPerSecond:
          type: integer
          format: int64
          nullable: true
          description: >
            Inbound network throughput across all interfaces. Null until a
            second sample is available to compute a rate.
          example: 40960
        networkTxBytesPerSecond:
          type: integer
          format: int64
          nullable: true
          description: >
            Outbound network throughput across all interfaces. Null until a
            second sample is available to compute a rate.
          example: 20480
        sampledAt:
          type: string
          format: date-time
          description: When the underlying sample was taken.
          example: '2025-09-01T12:00:00Z'

    NetworkInterface:
      type: object
      required: [name, model]
      properties:
        name: { type: string, example: ens3 }
        model: { type: string, enum: [virtio, e1000, rtl8139], example: virtio }
        macAddress: { type: string, example: '52:54:00:a1:b2:c3' }
        ipAddress: { type: string, example: 10.0.0.11 }
        network: { type: string, example: default }

    VirtualMachine:
      type: object
      required: [id, name, state, vcpus, memoryBytes, uptimeSeconds, disks, networkInterfaces]
      properties:
        id: { type: string, example: erp01 }
        name: { type: string, example: erp01 }
        state: { $ref: '#/components/schemas/VMState' }
        vcpus: { type: integer, example: 4 }
        memoryBytes: { type: integer, format: int64, example: 8589934592 }
        uptimeSeconds: { type: integer, nullable: true, example: 345600 }
        os: { type: string, example: Ubuntu 24.04 LTS }
        ipAddress: { type: string, nullable: true, example: 10.0.0.11 }
        isoId:
          type: string
          nullable: true
          description: Filename of the ISO currently attached as install media (CD-ROM), if any.
          example: ubuntu-24.04-live-server.iso
        disks:
          type: array
          items: { $ref: '#/components/schemas/Disk' }
        networkInterfaces:
          type: array
          items: { $ref: '#/components/schemas/NetworkInterface' }
        metrics: { $ref: '#/components/schemas/VmMetrics' }
        bootTime:
          type: string
          format: date-time
          nullable: true
          example: '2025-09-01T12:00:00Z'
        osType:
          type: string
          enum: [linux, windows, other]
          nullable: true
          description: |
            Guest OS family detected from the domain XML (presence of Hyper-V
            enlightenments implies `windows`; VMs created before profiles
            existed may report `null`).
          example: windows
        performanceProfile:
          $ref: '#/components/schemas/PerformanceProfile'
        warnings:
          type: array
          items: { type: string }
          nullable: true
          description: |
            Non-fatal notices, populated only in the create response (e.g. a
            Windows VM created without a VirtIO drivers ISO). Absent/null on
            reads.
          example:
            - 'Windows without a VirtIO drivers ISO: the installer will not see the virtio-scsi disk until vioscsi is loaded from another source.'

    PerformanceProfile:
      type: object
      description: |
        Performance-oriented settings applied to the domain XML at creation,
        as detected from the domain (null for VMs created before profiles
        existed).
      properties:
        cpuMode:
          type: string
          enum: [host-passthrough, host-model, custom]
          description: '`<cpu mode>` applied. host-passthrough gives best performance but limits live migration between hosts with different CPUs (multi-host phase concern).'
          example: host-passthrough
        diskBus:
          type: string
          enum: [scsi, sata]
          description: Disk bus applied (virtio-scsi for linux/windows profiles, SATA for other).
          example: scsi
        cache:
          type: string
          enum: [none]
          description: Disk cache mode applied.
          example: none
        ioThreads:
          type: integer
          nullable: true
          description: Number of iothreads dedicated to the SCSI controller (0/absent when not applied, e.g. the `other` profile).
          example: 1
        nicModel:
          type: string
          enum: [virtio, e1000e, rtl8139]
          nullable: true
          description: Network adapter model applied (null for VMs created before this was recorded).
          example: virtio
        hypervEnlightenments:
          type: array
          items: { type: string }
          description: |
            Hyper-V enlightenments actually present in the domain XML (only
            for `windows`; only the ones supported by the host's
            QEMU/libvirt, as detected from domain capabilities).
          example: [relaxed, vapic, spinlocks, vpindex, synic, stimer]

    TaskStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelling, cancelled]
      description: >
        queued: accepted, not started yet. running: worker executing.
        cancelling: cancel requested, waiting for the worker to return.
        succeeded/failed/cancelled: terminal states.

    Task:
      type: object
      required: [id, type, status, progress, cancellable, createdAt]
      properties:
        id: { type: string, example: task-000001 }
        type:
          type: string
          enum: [vm-create, backup-create, backup-restore]
          example: vm-create
        status: { $ref: '#/components/schemas/TaskStatus' }
        resourceId:
          type: string
          description: Identifier of the produced resource (VM name, backup point id). Empty while unknown.
          example: app01
        resourceName:
          type: string
          description: Human-readable target of the task (e.g. the VM name).
          example: app01
        message:
          type: string
          description: Current step description, when available.
          example: allocating disk volume
        error:
          type: string
          description: Failure reason when status is failed.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          example: 40
        warnings:
          type: array
          description: Non-fatal notes collected during execution (e.g. profile warnings).
          items: { type: string }
        cancellable:
          type: boolean
          description: Whether cancelTask can still be called.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time

    TaskList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        total: { type: integer, example: 1 }
