openapi: 3.1.0
info:
  title: UltraV API
  version: 1.0.0
  summary: API-first KVM/QEMU virtual machine management
  description: |
    UltraV is a modern, simple, API-first management layer for KVM/QEMU
    virtual machines on single Linux hosts.

    **Everything is an API.** Every UI capability is available here first.
    This contract is the source of truth for the Web UI, CLI, scripts,
    automation, and future AI agents (MCP adapters).

    ## Conventions
    - All requests/responses are JSON.
    - Every response includes an `X-Request-Id` header; errors also include `requestId` in the body.
    - Errors use a stable envelope: `{"error": {"code", "message", "requestId"}}`.
    - Destructive or long-running operations will use specific, semantically
      named operations (never generic `execute`/`command` endpoints).
  license:
    name: TBD
servers:
  - url: /api/v1
    description: Local host (single-node)

tags:
  - name: Host
    description: Host status and capabilities
  - name: Virtual Machines
    description: VM inventory and power operations
  - name: Storage
    description: Storage pools
  - name: Network
    description: Virtual networks
  - name: Health
    description: Liveness and readiness probes

paths:
  /host:
    get:
      operationId: getHost
      tags: [Host]
      summary: Get host status
      description: Returns status and identity of the hypervisor host.
      responses:
        '200':
          description: Host status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
              example:
                hostname: kvm01
                operatingSystem: Ubuntu 24.04 LTS
                kernel: 6.8.0-45-generic
                uptimeSeconds: 128934
                cpu: { model: AMD EPYC 7402P 24-Core Processor, cores: 24, threads: 48, usagePercent: 23.5 }
                memoryTotalBytes: 68719476736
                memoryUsedBytes: 21474836480
                virtualization: { kvmEnabled: true }
                qemuVersion: 8.2.0
                libvirtVersion: 10.0.0
        '500': { $ref: '#/components/responses/InternalError' }

  /capabilities:
    get:
      operationId: getCapabilities
      tags: [Host]
      summary: Get host capabilities
      description: >
        Feature discovery for UI, automation and agents. Clients must use
        this to know what the host supports instead of hardcoding assumptions.
      responses:
        '200':
          description: Host capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
              example:
                virtualization: { kvm: true, uefi: true }
                storage: { qcow2: true, raw: true, snapshots: true }
                features: { backup: false, migration: false, cloudInit: false }
        '500': { $ref: '#/components/responses/InternalError' }

  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Liveness probe
      description: Checks only that the application process is alive. Always returns 200 while the process is up.
      responses:
        '200':
          description: Application is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok }

  /ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Readiness probe
      description: Checks that the application and the HypervisorProvider are ready to serve requests.
      responses:
        '200':
          description: Ready to serve traffic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              example: { status: ready, hypervisor: ready }
        '503':
          description: Not ready (e.g. hypervisor provider unavailable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              example: { status: not-ready, hypervisor: unavailable }

  /storage/pools:
    get:
      operationId: listStoragePools
      tags: [Storage]
      summary: List storage pools
      responses:
        '200':
          description: Storage pools
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoragePoolList' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createStoragePool
      tags: [Storage]
      summary: Create a storage pool
      description: |
        Defines, builds and starts a new directory-based storage pool.
        The target directory is created if it does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoragePoolCreate' }
            example: { name: iso-store, targetPath: /var/lib/libvirt/isos, autostart: true }
      responses:
        '201':
          description: Pool created (returns the pool)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoragePool' }
        '400':
          description: Validation error (name/targetPath)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: A pool with this name already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: STORAGE_POOL_ALREADY_EXISTS, message: A storage pool with this name already exists, requestId: req_01HV3M9Z2K2Q } }
        '500': { $ref: '#/components/responses/InternalError' }

  /storage/pools/{id}:
    get:
      operationId: getStoragePool
      tags: [Storage]
      summary: Get a storage pool
      parameters: [ { $ref: '#/components/parameters/ResourceID' } ]
      responses:
        '200':
          description: Storage pool details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoragePool' }
        '404':
          description: Storage pool not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /storage/pools/{id}/refresh:
    post:
      operationId: refreshStoragePool
      tags: [Storage]
      summary: Refresh a storage pool
      description: Re-syncs the pool's volume list and usage numbers with the backing storage.
      parameters: [ { $ref: '#/components/parameters/ResourceID' } ]
      responses:
        '200':
          description: Pool refreshed (returns updated pool)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoragePool' }
        '404':
          description: Storage pool not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /storage/isos:
    get:
      operationId: listIsos
      tags: [Storage]
      summary: List ISO images in the library
      description: |
        ISO images available as installation media. Backed by a dedicated
        directory on the host (ULTRAV_ISO_DIR). Files are uploaded via the
        browser with `uploadIso`.
      responses:
        '200':
          description: ISO images
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IsoList' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: uploadIso
      tags: [Storage]
      summary: Upload an ISO image
      description: Streams the file into the ISO library. The filename must end in `.iso`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: ISO uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Iso' }
        '400':
          description: Invalid file (must be a .iso file)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: An ISO with this filename already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /storage/isos/{id}:
    delete:
      operationId: deleteIso
      tags: [Storage]
      summary: Delete an ISO image
      description: Removes the file from the ISO library.
      parameters: [ { $ref: '#/components/parameters/ResourceID' } ]
      responses:
        '204':
          description: ISO deleted
        '404':
          description: ISO not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /networks:
    get:
      operationId: listNetworks
      tags: [Network]
      summary: List virtual networks
      responses:
        '200':
          description: Virtual networks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkList' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createNetwork
      tags: [Network]
      summary: Create a virtual network
      description: |
        Creates a virtual network in one of three modes:
        - `nat`: routed + NAT subnet managed by libvirt (DHCP + dnsmasq)
        - `bridge`: passthrough to an existing host bridge (VMs get IPs on the
          host's LAN; requires a bridge such as br0 configured on the host --
          libvirt cannot create host bridges)
        - `isolated`: internal-only subnet, no outside connectivity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkCreate' }
      responses:
        '201':
          description: Network created (and started)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '400':
          description: Invalid input (missing bridgeName for bridge mode, bad CIDR, ...)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: A network with this name already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /host/bridges:
    get:
      operationId: listHostBridges
      tags: [Network]
      summary: List host bridge interfaces
      description: |
        Host Linux bridges (e.g. br0) that virtual networks in `bridge` mode can
        attach to. Creating these bridges is host configuration (netplan /
        NetworkManager), not something libvirt or UltraV does; use this list to
        detect what exists and guide the user when nothing is available.
      responses:
        '200':
          description: Host bridges (may be empty)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostBridgeList' }
        '500': { $ref: '#/components/responses/InternalError' }

  /networks/{id}:
    get:
      operationId: getNetwork
      tags: [Network]
      summary: Get a virtual network
      parameters: [ { $ref: '#/components/parameters/ResourceID' } ]
      responses:
        '200':
          description: Network details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '404':
          description: Network not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /networks/{id}/start:
    post:
      operationId: startNetwork
      tags: [Network]
      summary: Start a virtual network
      parameters: [ { $ref: '#/components/parameters/ResourceID' } ]
      responses:
        '200':
          description: Network started (returns updated network)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '404':
          description: Network not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Network is already active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /networks/{id}/stop:
    post:
      operationId: stopNetwork
      tags: [Network]
      summary: Stop a virtual network
      description: |
        Stops the virtual network. Running VMs attached to it keep working but
        lose new DHCP leases and NAT until the network is started again.
      parameters: [ { $ref: '#/components/parameters/ResourceID' } ]
      responses:
        '200':
          description: Network stopped (returns updated network)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Network' }
        '404':
          description: Network not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Network is already inactive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms:
    get:
      operationId: listVirtualMachines
      tags: [Virtual Machines]
      summary: List virtual machines
      responses:
        '200':
          description: Virtual machines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachineList' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createVirtualMachine
      tags: [Virtual Machines]
      summary: Create a virtual machine
      description: |
        Defines a new virtual machine: allocates a disk volume in the chosen
        storage pool and defines the domain (left stopped unless `start` is
        true). The VM is not booted from an OS image — attach installation
        media with virt-install/virt-manager afterwards if needed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VirtualMachineCreate' }
            example:
              name: app01
              vcpus: 2
              memoryBytes: 4294967296
              disk:
                poolId: default
                sizeBytes: 42949672960
                format: qcow2
              networkId: default
              start: false
      responses:
        '201':
          description: Virtual machine created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachine' }
        '400':
          description: Invalid create specification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: A virtual machine with this name already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms/{id}:
    get:
      operationId: getVirtualMachine
      tags: [Virtual Machines]
      summary: Get a virtual machine
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      responses:
        '200':
          description: Virtual machine details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachine' }
        '404': { $ref: '#/components/responses/VMNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms/{id}/start:
    post:
      operationId: startVirtualMachine
      tags: [Virtual Machines]
      summary: Start a virtual machine
      description: Powers on a stopped virtual machine. Returns 409 if already running.
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      responses:
        '200':
          description: VM started (returns updated VM)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachine' }
        '404': { $ref: '#/components/responses/VMNotFound' }
        '409': { $ref: '#/components/responses/VMInvalidState' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms/{id}/console:
    get:
      operationId: openVMConsole
      tags: [Virtual Machines]
      summary: Open the VM graphical console (WebSocket)
      description: |
        Upgrades the connection to a WebSocket and proxies binary frames to the
        VM's graphical console (VNC/RFB). The browser side is a noVNC client;
        binary messages are raw VNC octets. Requires a running VM (409 otherwise).
        Note: this endpoint is a WebSocket — OpenAPI cannot fully describe the
        upgraded protocol.
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      responses:
        '101':
          description: Switching Protocols — WebSocket established, frames are raw VNC
        '404': { $ref: '#/components/responses/VMNotFound' }
        '409': { $ref: '#/components/responses/VMInvalidState' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms/{id}/shutdown:
    post:
      operationId: shutdownVirtualMachine
      tags: [Virtual Machines]
      summary: Gracefully shut down a virtual machine
      description: Sends an ACPI shutdown event. The guest OS should shut down cleanly.
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      responses:
        '200':
          description: Shutdown requested (returns updated VM)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachine' }
        '404': { $ref: '#/components/responses/VMNotFound' }
        '409': { $ref: '#/components/responses/VMInvalidState' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms/{id}/reboot:
    post:
      operationId: rebootVirtualMachine
      tags: [Virtual Machines]
      summary: Reboot a virtual machine
      description: Sends an ACPI reboot event. Returns 409 if the VM is not running.
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      responses:
        '200':
          description: Reboot requested (returns updated VM)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachine' }
        '404': { $ref: '#/components/responses/VMNotFound' }
        '409': { $ref: '#/components/responses/VMInvalidState' }
        '500': { $ref: '#/components/responses/InternalError' }

  /vms/{id}/stop:
    post:
      operationId: forceStopVirtualMachine
      tags: [Virtual Machines]
      summary: Force stop a virtual machine
      description: |
        Immediately powers off the VM, equivalent to pulling the power cable.
        The guest OS is not given a chance to shut down cleanly; data loss or
        filesystem corruption is possible. Prefer `shutdownVirtualMachine`.
      parameters: [ { $ref: '#/components/parameters/VMId' } ]
      responses:
        '200':
          description: VM force stopped (returns updated VM)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachine' }
        '404': { $ref: '#/components/responses/VMNotFound' }
        '409': { $ref: '#/components/responses/VMInvalidState' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  parameters:
    VMId:
      name: id
      in: path
      required: true
      description: Virtual machine identifier (name).
      schema: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$', example: erp01 }

    ResourceID:
      name: id
      in: path
      required: true
      description: Resource identifier (libvirt name).
      schema: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$', example: default }

  responses:
    VMNotFound:
      description: Virtual machine not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: VM_NOT_FOUND, message: Virtual machine was not found, requestId: req_01HV3M9Z2K }
    VMInvalidState:
      description: Operation not valid for the current VM state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: VM_INVALID_STATE, message: Virtual machine is not running, requestId: req_01HV3M9Z2L }
    InternalError:
      description: Internal server error (no internal details are exposed)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: INTERNAL_ERROR, message: An internal error occurred, requestId: req_01HV3M9Z2M }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, example: VM_NOT_FOUND }
            message: { type: string, example: Virtual machine was not found }
            requestId: { type: string, example: req_01HV3M9Z2K }

    Host:
      type: object
      required: [hostname, operatingSystem, kernel, uptimeSeconds, cpu, memoryTotalBytes, memoryUsedBytes]
      properties:
        hostname: { type: string, example: kvm01 }
        operatingSystem: { type: string, example: Ubuntu 24.04 LTS }
        kernel: { type: string, example: 6.8.0-45-generic }
        uptimeSeconds: { type: integer, example: 128934 }
        cpu: { $ref: '#/components/schemas/Cpu' }
        memoryTotalBytes: { type: integer, format: int64, example: 68719476736 }
        memoryUsedBytes: { type: integer, format: int64, example: 21474836480 }
        virtualization: { $ref: '#/components/schemas/HostVirtualization' }
        storageTotalBytes: { type: integer, format: int64, example: 2199023255552 }
        storageUsedBytes: { type: integer, format: int64, example: 789128484864 }
        qemuVersion: { type: string, example: 8.2.0 }
        libvirtVersion: { type: string, example: 10.0.0 }

    Cpu:
      type: object
      required: [model, cores, threads]
      properties:
        model: { type: string, example: AMD EPYC 7402P 24-Core Processor }
        cores: { type: integer, example: 24 }
        threads: { type: integer, example: 48 }
        usagePercent: { type: number, format: float, example: 23.5 }

    HostVirtualization:
      type: object
      properties:
        kvmEnabled: { type: boolean, example: true }

    VirtualMachineList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/VirtualMachine' }
        total: { type: integer, example: 4 }

    Network:
      type: object
      required: [id, name, state, autostart, dhcpEnabled]
      properties:
        id: { type: string, example: default }
        name: { type: string, example: default }
        state: { type: string, enum: [active, inactive], example: active }
        autostart: { type: boolean, example: true }
        bridge: { type: string, nullable: true, example: virbr0 }
        ipAddress: { type: string, nullable: true, example: 10.0.0.1 }
        ipPrefix: { type: integer, nullable: true, example: 24 }
        dhcpEnabled: { type: boolean, example: true }
        domainName: { type: string, nullable: true, example: default }
        mode: { type: string, enum: [nat, bridge, isolated], example: nat }

    NetworkCreate:
      type: object
      required: [name, mode]
      properties:
        name: { type: string, example: lan }
        mode:
          type: string
          enum: [nat, bridge, isolated]
          example: nat
        bridgeName:
          type: string
          nullable: true
          example: br0
          description: Host bridge to attach to (required when mode is bridge).
        cidr:
          type: string
          nullable: true
          example: 192.168.100.0/24
          description: Subnet for nat/isolated modes (required for those modes).
        dhcpEnabled: { type: boolean, nullable: true, example: true }
        autostart: { type: boolean, nullable: true, example: true }

    HostBridge:
      type: object
      required: [name, active]
      properties:
        name: { type: string, example: br0 }
        active: { type: boolean, example: true }

    HostBridgeList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HostBridge' }
        total: { type: integer, example: 1 }

    NetworkList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Network' }
        total: { type: integer, example: 2 }

    StoragePool:
      type: object
      required: [id, name, type, state, capacityBytes, allocationBytes, availableBytes]
      properties:
        id: { type: string, example: default }
        name: { type: string, example: default }
        type: { type: string, enum: [dir, fs, netfs, lvm, disk, iscsi, zfs, rbd, other], example: dir }
        state: { type: string, enum: [active, inactive], example: active }
        autostart: { type: boolean, example: true }
        capacityBytes: { type: integer, format: int64, example: 2199023255552 }
        allocationBytes: { type: integer, format: int64, example: 789128484864 }
        availableBytes: { type: integer, format: int64, example: 1409894770688 }
        targetPath: { type: string, nullable: true, example: /var/lib/libvirt/images }

    StoragePoolCreate:
      type: object
      required: [name, targetPath]
      properties:
        name: { type: string, example: iso-store, description: Same rules as resource ids (a-z0-9._-, max 64) }
        type: { type: string, enum: [dir], default: dir, example: dir, description: Only directory pools are supported for now }
        targetPath: { type: string, example: /var/lib/libvirt/isos, description: Absolute host path; created if missing }
        autostart: { type: boolean, default: true, example: true }

    StoragePoolList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StoragePool' }
        total: { type: integer, example: 2 }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok], example: ok }

    Readiness:
      type: object
      required: [status, hypervisor]
      properties:
        status: { type: string, enum: [ready, not-ready], example: ready }
        hypervisor: { type: string, enum: [ready, unavailable], example: ready }

    Capabilities:
      type: object
      required: [virtualization, storage, features]
      properties:
        virtualization: { $ref: '#/components/schemas/CapabilitiesVirtualization' }
        storage: { $ref: '#/components/schemas/CapabilitiesStorage' }
        features: { $ref: '#/components/schemas/CapabilitiesFeatures' }

    CapabilitiesVirtualization:
      type: object
      required: [kvm, uefi]
      properties:
        kvm: { type: boolean }
        uefi: { type: boolean }

    CapabilitiesStorage:
      type: object
      required: [qcow2, raw, snapshots]
      properties:
        qcow2: { type: boolean }
        raw: { type: boolean }
        snapshots: { type: boolean }

    CapabilitiesFeatures:
      type: object
      required: [backup, migration, cloudInit]
      properties:
        backup: { type: boolean, example: false }
        migration: { type: boolean, example: false }
        cloudInit: { type: boolean, example: false }

    VMState:
      type: string
      enum: [running, stopped, paused, shutting-down, starting, error]
      description: |
        - running: powered on and operational
        - stopped: powered off
        - shutting-down: graceful shutdown in progress
        - starting: power-on in progress

    VirtualMachineCreate:
      type: object
      required: [name, vcpus, memoryBytes, disk]
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$'
          example: app01
        vcpus: { type: integer, minimum: 1, maximum: 64, example: 2 }
        memoryBytes:
          type: integer
          format: int64
          minimum: 16777216
          example: 4294967296
        disk: { $ref: '#/components/schemas/DiskCreate' }
        networkId: { type: string, example: default }
        isoId:
          type: string
          nullable: true
          description: Optional ISO from the library to attach as install media (CD-ROM, first boot device).
          example: ubuntu-24.04-live-server.iso
        start: { type: boolean, description: Power on immediately after creation., example: false }

    DiskCreate:
      type: object
      required: [poolId, sizeBytes]
      properties:
        poolId: { type: string, example: default }
        sizeBytes:
          type: integer
          format: int64
          minimum: 1048576
          example: 42949672960
        format: { type: string, enum: [qcow2, raw], example: qcow2 }

    Iso:
      type: object
      required: [id, fileName, sizeBytes]
      properties:
        id: { type: string, example: ubuntu-24.04-live-server.iso }
        fileName: { type: string, example: ubuntu-24.04-live-server.iso }
        sizeBytes: { type: integer, format: int64, example: 2197821440 }
        uploadedAt:
          type: string
          format: date-time
          example: '2025-09-01T12:00:00Z'

    IsoList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Iso' }
        total: { type: integer, example: 2 }

    Disk:
      type: object
      required: [name, format, sizeBytes]
      properties:
        name: { type: string, example: vda }
        format: { type: string, enum: [qcow2, raw], example: qcow2 }
        sizeBytes: { type: integer, format: int64, example: 128849018880 }
        bus: { type: string, enum: [virtio, sata, scsi], example: virtio }

    NetworkInterface:
      type: object
      required: [name, model]
      properties:
        name: { type: string, example: ens3 }
        model: { type: string, enum: [virtio, e1000, rtl8139], example: virtio }
        macAddress: { type: string, example: '52:54:00:a1:b2:c3' }
        ipAddress: { type: string, example: 10.0.0.11 }
        network: { type: string, example: default }

    VirtualMachine:
      type: object
      required: [id, name, state, vcpus, memoryBytes, uptimeSeconds, disks, networkInterfaces]
      properties:
        id: { type: string, example: erp01 }
        name: { type: string, example: erp01 }
        state: { $ref: '#/components/schemas/VMState' }
        vcpus: { type: integer, example: 4 }
        memoryBytes: { type: integer, format: int64, example: 8589934592 }
        uptimeSeconds: { type: integer, nullable: true, example: 345600 }
        os: { type: string, example: Ubuntu 24.04 LTS }
        ipAddress: { type: string, nullable: true, example: 10.0.0.11 }
        disks:
          type: array
          items: { $ref: '#/components/schemas/Disk' }
        networkInterfaces:
          type: array
          items: { $ref: '#/components/schemas/NetworkInterface' }
        bootTime:
          type: string
          format: date-time
          nullable: true
          example: '2025-09-01T12:00:00Z'
