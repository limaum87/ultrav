services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      # Modo do hipervisor. O compose é o caminho de deploy em host KVM real;
      # para demonstração sem KVM use HYPERVISOR_PROVIDER=mock no deploy/.env.
      HYPERVISOR_PROVIDER: ${HYPERVISOR_PROVIDER:-libvirt}
      HYPERVISOR_LIBVIRT_URI: ${HYPERVISOR_LIBVIRT_URI:-qemu:///system}
      ULTRAV_PORT: "8080"
      ULTRAV_CORS_ORIGIN: ""
      # Regra dos caminhos (AGENTS.md, Fase 4): caminho idêntico dentro e fora do
      # container, porque quem abre o arquivo é o qemu NO HOST.
      ULTRAV_ISO_DIR: /var/lib/libvirt/isos
      ULTRAV_DB_PATH: /var/lib/ultrav/data/ultrav.db
      # Backup library: bind mount de caminho idêntico (Regra dos caminhos) —
      # o qemu do host abre esses arquivos durante backup/restore.
      ULTRAV_BACKUP_DIR: /var/lib/ultrav/backups
      # Senha do admin inicial (criado só na primeira inicialização, banco vazio).
      # Se vazia, uma senha aleatória é gerada e registrada no log do backend.
      ULTRAV_ADMIN_USER: ${ULTRAV_ADMIN_USER:-admin}
      ULTRAV_ADMIN_PASSWORD: ${ULTRAV_ADMIN_PASSWORD:-admin@2026}
      # OBRIGATÓRIO: sem um segredo fixo o backend gera um efêmero e todas as
      # sessões caem a cada restart do container.
      ULTRAV_JWT_SECRET: ${ULTRAV_JWT_SECRET:?defina ULTRAV_JWT_SECRET em deploy/.env (openssl rand -hex 32)}
    volumes:
      - /var/run/libvirt:/var/run/libvirt
      - /var/lib/libvirt/isos:/var/lib/libvirt/isos
      # Disk images: needed for offline backup (file copy) and restore
      # (qemu-img convert writes the volume). Identical path inside and out
      # (Regra dos caminhos, AGENTS.md Fase 4).
      - /var/lib/libvirt/images:/var/lib/libvirt/images
      # Console VNC: o backend conecta direto no socket unix da VM
      # (/var/lib/libvirt/qemu/domain-*/vnc.sock). Sem este mount o dial
      # falha e o fallback (OpenGraphicsFD) quebra com "Failed to recv file
      # descriptor" — fd-passing não atravessa o bind mount do socket.
      - /var/lib/libvirt/qemu:/var/lib/libvirt/qemu:ro
      # Sem isto o card do host mostra o SO do container (Debian), não o do host.
      - /etc/os-release:/etc/os-release:ro
      - ultrav-data:/var/lib/ultrav/data
      # Backup library: bind mount de caminho idêntico (Regra dos caminhos) —
      # quem grava os arquivos-alvo do backup é o qemu NO HOST.
      - /var/lib/ultrav/backups:/var/lib/ultrav/backups
    # Os GIDs variam por distro/host (Debian usa 137/104; Ubuntu 26.04 usa
    # 982/992). Nunca hardcode: preencha deploy/.env com
    #   getent group libvirt | cut -d: -f3
    #   getent group kvm     | cut -d: -f3
    group_add:
      - "${LIBVIRT_GID:?defina LIBVIRT_GID em deploy/.env (getent group libvirt)}"
      - "${KVM_GID:?defina KVM_GID em deploy/.env (getent group kvm)}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        # Entra no SAN do certificado autoassinado (HTTPS é obrigatório para o
        # noVNC). Use o IP/DNS pelo qual a UI será acessada.
        ULTRAV_HOST_IP: ${ULTRAV_HOST_IP:?defina ULTRAV_HOST_IP em deploy/.env}
    ports:
      - "8275:443"  # UI (HTTPS, noVNC exige contexto seguro) + /api + /docs
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ultrav-data:
