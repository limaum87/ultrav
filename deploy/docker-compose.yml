services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      HYPERVISOR_PROVIDER: mock
      ULTRAV_PORT: "8080"
      ULTRAV_CORS_ORIGIN: ""
      ULTRAV_ISO_DIR: /var/lib/ultrav/isos
      ULTRAV_DB_PATH: /var/lib/ultrav/data/ultrav.db
      # Senha do admin inicial (criado só na primeira inicialização, banco vazio).
      # Se vazia, uma senha aleatória é gerada e registrada no log do backend.
      ULTRAV_ADMIN_USER: admin
      ULTRAV_ADMIN_PASSWORD: ""
      # Defina um segredo fixo para que as sessões sobrevivam a restarts:
      # ULTRAV_JWT_SECRET: troque-por-um-segredo-longo
    volumes:
      - ultrav-isos:/var/lib/ultrav/isos
      - ultrav-data:/var/lib/ultrav/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "8275:80"   # UI + /api + /openapi.json + /docs (single entry point)
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ultrav-isos:
  ultrav-data:
