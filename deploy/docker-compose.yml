services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      HYPERVISOR_PROVIDER: libvirt
      ULTRAV_PORT: "8080"
      ULTRAV_CORS_ORIGIN: ""
      # Modo mock: qualquer caminho serve. Modo libvirt: veja o aviso no
      # volume `ultrav-isos` no fim deste arquivo — o caminho precisa ser
      # idêntico dentro do container e no host.
      # Modo libvirt: bind mount de caminho idêntico (Regra dos caminhos, AGENTS.md Fase 4)
      ULTRAV_ISO_DIR: /var/lib/libvirt/isos
      ULTRAV_DB_PATH: /var/lib/ultrav/data/ultrav.db
      # Senha do admin inicial (criado só na primeira inicialização, banco vazio).
      # Se vazia, uma senha aleatória é gerada e registrada no log do backend.
      ULTRAV_ADMIN_USER: admin
      ULTRAV_ADMIN_PASSWORD: ""
      # Defina um segredo fixo para que as sessões sobrevivam a restarts:
      # ULTRAV_JWT_SECRET: troque-por-um-segredo-longo
    volumes:
      - /var/run/libvirt:/var/run/libvirt
      - /var/lib/libvirt/isos:/var/lib/libvirt/isos
      # Console VNC: o backend conecta direto no socket unix da VM
      # (/var/lib/libvirt/qemu/domain-*/vnc.sock). Sem este mount o dial
      # falha e o fallback (OpenGraphicsFD) quebra com "Failed to recv file
      # descriptor" — fd-passing não atravessa o bind mount do socket.
      - /var/lib/libvirt/qemu:/var/lib/libvirt/qemu:ro
      - ultrav-data:/var/lib/ultrav/data
    # Acesso ao socket do libvirt (root:libvirt, gid 137) e ao dir de ISOs
    # (root:kvm, gid 104) no host
    group_add:
      - "137"
      - "104"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "8275:443"  # UI (HTTPS, noVNC exige contexto seguro) + /api + /docs
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # ATENÇÃO — volume nomeado só serve para HYPERVISOR_PROVIDER=mock.
  #
  # Com libvirt real, o backend grava o caminho do ISO no XML do domínio e
  # quem abre o arquivo é o qemu, NO HOST. Um volume nomeado faz
  # /var/lib/ultrav/isos significar coisas diferentes nos dois namespaces:
  # o upload funciona, o os.Stat de validação passa dentro do container e a
  # VM só quebra no start, com
  #   Cannot access storage file '/var/lib/ultrav/isos/<arquivo>.iso'
  #
  # Em modo libvirt, substitua por um bind mount de caminho idêntico (o
  # docker-compose.override.yml do host de produção faz isso):
  #   environment:
  #     ULTRAV_ISO_DIR: /var/lib/libvirt/isos
  #   volumes:
  #     - /var/lib/libvirt/isos:/var/lib/libvirt/isos
  # O diretório precisa ser gravável pelo usuário do container (`nobody`):
  #   sudo chgrp kvm /var/lib/libvirt/isos && sudo chmod 2775 /var/lib/libvirt/isos
  ultrav-isos:
  ultrav-data:
