# WebSocket upgrade header value (used by the /api/ console proxy).
# This file is included at http context (conf.d), where map must live.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API + contract endpoints -> Go backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        # WebSocket (VM console) — keep upstream connections open
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        # ISO uploads can be several GB — no body size limit on the API.
        client_max_body_size 0;
        proxy_request_buffering off;
    }
    location = /openapi.json {
        proxy_pass http://backend:8080/openapi.json;
    }
    location = /docs {
        proxy_pass http://backend:8080/docs;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
